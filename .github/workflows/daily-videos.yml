name: Daily videos

# Runs in the cloud on a schedule, free, even with your Mac off.
# It reads scripts from the content folder, renders each into a narrated
# illustrated video, writes SEO with Claude, and publishes to YouTube.

on:
  push:                    # start automatically when you commit a new script
    branches: [main]
    paths:
      - "content/**"
  schedule:
    - cron: "0 7 * * *"   # every day at 07:00 UTC. Change the time to suit you.
  workflow_dispatch:       # run by hand from the Actions tab

permissions:
  contents: write          # so it can archive published scripts back to the repo

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make sure ffmpeg is present
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install the storytime voice and caption engine
        run: python3 -m pip install --quiet edge-tts pillow

      - name: Sync to the latest scripts
        # A queued run froze its view of the content folder when it was triggered.
        # Refresh to the newest commit right before rendering, so a run that waited
        # in the queue sees scripts a previous run already published and skips them.
        # This is what stops the same video being made and uploaded twice.
        run: |
          git fetch -q origin main
          git reset --hard -q FETCH_HEAD

      - name: Restore the never-repeat presenter history
        uses: actions/cache@v4
        with:
          path: output/.presenter-history.json
          key: presenter-history-${{ github.run_id }}
          restore-keys: |
            presenter-history-

      - name: Render and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_YT_PRIVACY: ${{ secrets.CF_YT_PRIVACY || 'private' }}
          CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}
          CF_STYLE: story
          CF_SEO: "0"
          CF_INPUT: content
          CF_OUTPUT: output
        run: node worker/watch.mjs --once

      - name: Save the archived scripts back to the repo
        if: always()
        run: |
          # the worker already moved only the successful scripts into content/published;
          # commit whatever changed so any failed script stays in content and is retried
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Archive published scripts [skip ci]" || true
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -q origin main && git push -q origin main && break
              echo "archive push retry $i"; sleep 4
            done
          fi

      - name: Keep the finished videos and thumbnails as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            output/*.mp4
            output/*-thumbnail.jpg
            output/*.txt
          if-no-files-found: ignore
